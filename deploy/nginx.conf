# ============================================================
# 入口网关（TECH_DESIGN 15.4）
#
# 拓扑：浏览器 → nginx:80 → { web:3000 (Nuxt SSR) | app:8080 (Go) }
# 同域反代，因此不配置任何 CORS 头；若出现 Access-Control-* 说明部署形态被改坏。
# ============================================================

upstream blog_web {
    server web:3000;
    keepalive 32;
}

upstream blog_app {
    server app:8080;
    keepalive 32;
}

# WebSocket 需要 Upgrade，单独一张 map 避免普通请求带上 Connection: upgrade
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # 上传上限略大于应用限制（10MB），避免 Nginx 先于应用拒绝
    client_max_body_size 12m;
    client_body_timeout 30s;

    # 基础安全头。HSTS 在启用 TLS 后再开，纯 HTTP 阶段开了无效且会误导
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # ---------- 运维端点：只允许内网 ----------
    location = /metrics {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://blog_app;
        proxy_set_header Host $host;
    }

    location = /healthz { proxy_pass http://blog_app; access_log off; }
    location = /readyz  { proxy_pass http://blog_app; access_log off; }

    # ---------- 业务接口 ----------
    location /api/ {
        proxy_pass http://blog_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # 应用生成邮件绝对链接依赖原始 scheme，TLS 终止后必须透传
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
    }

    # ---------- WebSocket ----------
    location /ws {
        proxy_pass http://blog_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        # 必须远大于应用心跳（30s）与读超时（90s），否则空闲连接被网关先掐断
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---------- 构建产物：长缓存 ----------
    # Nuxt 产物文件名带内容哈希，可以 immutable；换版本即换文件名，不存在脏缓存
    location /_nuxt/ {
        proxy_pass http://blog_web;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ---------- 用户端与管理端：同一个 Nuxt SSR 进程 ----------
    # 管理端不是独立 SPA，路由在 /admin/*，由 Nuxt 直接渲染，因此不需要 alias + try_files
    location / {
        proxy_pass http://blog_web;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
    }
}
