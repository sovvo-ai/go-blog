<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>注册 · 墨痕</title>
<link rel="stylesheet" href="/assets/site.css">
<link rel="stylesheet" href="/assets/components.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <p class="logo">墨痕</p>
    <p class="sub">写作是对思考的最后一次编译。</p>
    <h1>创建账号</h1>
    <div class="field"><label>用户名</label><input type="text" placeholder="3–20 位字母数字"></div><div class="field"><label>邮箱</label><input type="email" placeholder="用于接收验证邮件"></div><div class="field"><label>密码</label><input type="password" placeholder="至少 8 位，含字母与数字"></div>
    <p style="font-size:11px;color:var(--ink-4);margin:-6px 0 16px;">注册后需点击邮件中的验证链接才能登录。</p>
    <button class="btn-wide">注 册</button>
    <p class="alt">已有账号？<a href="/login.html">直接登录</a></p>
  </div>
</div>
</body>
</html>
