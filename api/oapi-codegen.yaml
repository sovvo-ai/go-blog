# oapi-codegen 配置
#
# 用法：
#   go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen \
#     -config api/oapi-codegen.yaml api/openapi.yaml
#
# 设计约束（TECH_DESIGN 2.1.3）：
#   只生成数据模型，不生成 server 骨架。
#   路由由 Gin 手工注册，避免 oapi-codegen 的路由约定与之冲突。

package: dto
output: internal/dto/api.gen.go

generate:
  models: true

output-options:
  skip-prune: false
