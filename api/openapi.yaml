        purpose=chat 走私有桶（仅会话成员经 /media/{id}/url 换签名地址访问）。
        真实类型读文件魔数判定；sha256 命中已有记录时直接复用。
      operationId: uploadImage
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                purpose:
                  type: string
                  enum: [article, avatar, chat]
                  default: article
      responses:
        '201':
          description: 上传成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImageUploadResponse' }
