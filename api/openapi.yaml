      summary: 获取媒体访问地址
      description: |
        公开桶媒体返回永久 URL；聊天图片（私有桶）校验调用者为该媒体所属
        会话成员后签发 1 小时有效的签名 URL，非成员 403（API_SPEC 4.7）。
      operationId: getMediaUrl
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaUrlResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /conversations:
    get:
      tags: [chat]
      summary: 会话列表
      description: 按 last_message_at 倒序，无消息的会话排最后（API_SPEC 4.8）。
      operationId: listConversations
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, minimum: 1, maximum: 50 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [chat]
      summary: 发起单聊
      description: |
        幂等：会话已存在直接返回（created=false）。conversation_key =
        min(uid):max(uid) 保证 (A,B) 与 (B,A) 唯一。每日新建上限 20 个。
      operationId: createConversation
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConversationCreateRequest' }
      responses:
        '200':
          description: 会话已存在
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationCreateResponse' }
        '201':
          description: 会话已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationCreateResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /conversations/{id}/messages:
    get:
      tags: [chat]
      summary: 历史消息
      description: |
        before_id 向上翻历史（降序），after_seq 断线补齐（升序），二者互斥。
        消息不含 is_read，响应带 peer_last_read_seq 供前端按 seq 比较（API_SPEC 4.8）。
      operationId: listMessages
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: before_id
          in: query
          schema: { type: string }
        - name: after_seq
          in: query
          schema: { type: integer, minimum: 0 }
        - name: limit
          in: query
          schema: { type: integer, default: 30, minimum: 1, maximum: 50 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [chat]
      summary: 发送消息
      description: |
        client_msg_id 幂等：重复提交返回首次结果（200），首次为 201。
        落库成功后经 WebSocket 推送 message.new 给对方。对方账号不可用返回 50003。
      operationId: sendMessage
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MessageSendRequest' }
      responses:
        '200':
          description: 幂等命中（此前已发送成功）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageSendResponse' }
        '201':
          description: 发送成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageSendResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /conversations/{id}/read:
    put:
      tags: [chat]
      summary: 标记会话已读
      description: |
        更新调用者自己的已读游标（user_id 取自登录态）。单调递增，新值小于
        当前值不生效仍返回 204；大于 seq_counter 时按 seq_counter 截断。
        成功后推送 message.read 给对方（API_SPEC 4.8）。
      operationId: markConversationRead
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConversationReadRequest' }
      responses:
        '204':
          description: 已标记
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /conversations/{id}/mute:
    put:
      tags: [chat]
      summary: 会话免打扰
      operationId: setConversationMute
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConversationMuteRequest' }
      responses:
        '204':
          description: 已设置
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /ws/ticket:
    post:
      tags: [chat]
      summary: 获取 WebSocket 票据
      description: 一次性使用，60 秒有效，用完即删（API_SPEC 4.8）。
      operationId: createWsTicket
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WsTicketResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /ws:
    get:
      tags: [chat]
      summary: WebSocket 连接
      description: |
        WebSocket 升级端点，凭一次性 ticket 连接。票据无效 4001 关闭，
        账号被禁用 4003 关闭。V1.0 仅下行推送，无上行消息（API_SPEC 4.8）。
        注意：实际路径在站点根 /ws（不在 /api/v1 下），Nginx 按
        TECH_DESIGN 15.4 单独代理。
      operationId: wsConnect
      parameters:
        - name: ticket
          in: query
          required: true
          schema: { type: string }
      responses:
        '101':
          description: 升级为 WebSocket
        '400':
          description: 缺少 ticket

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token

  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
      description: 从 `csrf_token` Cookie 读取，写请求必带

  responses:
    BadRequest:
      description: 参数错误（10001）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: 未登录或凭证失效（10002）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: 已登录但无权限（10003 / 10006 CSRF 失败）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: 资源不存在（10004）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: 冲突（20001 邮箱已注册 / 20002 用户名占用）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: 触发限流（10005）
      headers:
        Retry-After:
          schema:
            type: integer
          description: 建议等待秒数
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: 依赖不可用（11005 存储等）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    # ---------- 通用 ----------
    ErrorResponse:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          type: integer
          description: 业务错误码，非 0 即失败
          example: 20003
        message:
          type: string
          description: 可直接展示给用户的中文提示
          example: 用户名或密码错误
        data:
          nullable: true
          description: 失败时恒为 null
        request_id:
          type: string
          example: 01HQZ8X2K9J4M

    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          example: password
        message:
          type: string
          example: 密码至少 8 位
      description: 参数校验失败时的字段级明细，放在 data.errors

    ValidationErrorData:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'

    SimpleResponse:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: ok
        data:
          nullable: true
        request_id:
          type: string

    # ---------- 用户 ----------
    Role:
      type: string
      enum: [reader, author, admin]
      description: 角色层级 reader < author < admin

    UserStatus:
      type: string
      enum: [pending_verify, active, disabled]

    UserFull:
      type: object
      required: [id, username, email, nickname, avatar_url, bio, role, status, created_at]
      properties:
        id:
          type: string
          example: "1001"
        username:
          type: string
          example: zhangsan
        email:
          type: string
          format: email
        nickname:
          type: string
          example: 张三
        avatar_url:
          type: string
          example: https://cdn.example.com/a/256.webp
        bio:
          type: string
          example: 写代码的
        role:
          $ref: '#/components/schemas/Role'
        status:
          $ref: '#/components/schemas/UserStatus'
        created_at:
          type: string
          format: date-time

    UserBrief:
      type: object
      required: [id, nickname, avatar_url]
      properties:
        id:
          type: string
        nickname:
          type: string
        avatar_url:
          type: string

    UserPublic:
      type: object
      required: [id, username, nickname, avatar_url, bio, article_count, created_at]
      properties:
        id:
          type: string
        username:
          type: string
        nickname:
          type: string
        avatar_url:
          type: string
        bio:
          type: string
        article_count:
          type: integer
          description: 已发布文章数
        created_at:
          type: string
          format: date-time

    # ---------- 认证请求 ----------
    RegisterRequest:
      type: object
      required: [username, email, password]
      properties:
        username:
          type: string
          minLength: 4
          maxLength: 20
          pattern: '^[a-zA-Z0-9_]+$'
          description: 4–20 位字母、数字、下划线
        email:
          type: string
          format: email
          maxLength: 128
        password:
          type: string
          minLength: 8
          maxLength: 32
          description: 8–32 位，须同时包含字母与数字
          format: password

    EmailOnlyRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    LoginRequest:
      type: object
      required: [account, password]
      properties:
        account:
          type: string
          description: 邮箱或用户名
          example: zhang@example.com
        password:
          type: string
          format: password

    ResetPasswordRequest:
      type: object
      required: [token, new_password]
      properties:
        token:
          type: string
          description: 邮件中的重置令牌
        new_password:
          type: string
          minLength: 8
          maxLength: 32
          format: password

    UpdateProfileRequest:
      type: object
      properties:
        nickname:
          type: string
          minLength: 1
          maxLength: 32
        bio:
          type: string
          maxLength: 255

    ChangePasswordRequest:
      type: object
      required: [old_password, new_password]
      properties:
        old_password:
          type: string
          format: password
        new_password:
          type: string
          minLength: 8
          maxLength: 32
          format: password

    # ---------- 认证响应 ----------
    RegisterData:
      type: object
      required: [user_id, status]
      properties:
        user_id:
          type: string
        status:
          $ref: '#/components/schemas/UserStatus'

    RegisterResponse:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: 注册成功，请查收验证邮件
        data:
          $ref: '#/components/schemas/RegisterData'
        request_id:
          type: string

    LoginData:
      type: object
      required: [user, csrf_token]
      properties:
        user:
          $ref: '#/components/schemas/UserFull'
        csrf_token:
          type: string
          description: 同时写入非 HttpOnly Cookie，前端读取后放入请求头

    LoginResponse:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: ok
        data:
          $ref: '#/components/schemas/LoginData'
        request_id:
          type: string

    RefreshData:
      type: object
      required: [csrf_token]
      properties:
        csrf_token:
          type: string

    RefreshResponse:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: ok
        data:
          $ref: '#/components/schemas/RefreshData'
        request_id:
          type: string

    UserResponse:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: ok
        data:
          $ref: '#/components/schemas/UserFull'
        request_id:
          type: string

    PublicUserResponse:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: ok
        data:
          $ref: '#/components/schemas/UserPublic'
        request_id:
          type: string

    AvatarData:
      type: object
      required: [avatar_url, media_id]
      properties:
        avatar_url:
          type: string
        media_id:
          type: string

    AvatarResponse:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: ok
        data:
          $ref: '#/components/schemas/AvatarData'
        request_id:
          type: string

    ArticleStatus:
      type: string
      enum: [draft, pending, published, rejected, offline, archived, deleted]

    AuthorBrief:
      type: object
      required: [id, nickname, avatar_url]
      properties:
        id: { type: string }
        nickname: { type: string }
        avatar_url: { type: string }

    CategoryBrief:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }

    TagBrief:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }

    CategoryItem:
      type: object
      required: [id, name, slug, article_count]
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        article_count: { type: integer }
        sort: { type: integer }

    TagItem:
      type: object
      required: [id, name, slug, article_count]
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        article_count: { type: integer }

    ArticleBrief:
      type: object
      required: [id, slug, title, summary, cover_url, author, view_count, like_count, comment_count, reading_time, is_top]
      properties:
        id: { type: string }
        slug: { type: string }
        title: { type: string }
        summary: { type: string }
        cover_url: { type: string }
        author: { $ref: '#/components/schemas/AuthorBrief' }
        category:
          allOf:
            - $ref: '#/components/schemas/CategoryBrief'
          nullable: true
        tags:
          type: array
          items: { $ref: '#/components/schemas/TagBrief' }
        view_count: { type: integer }
        like_count: { type: integer }
        comment_count: { type: integer }
        reading_time: { type: integer }
        is_top: { type: boolean }
        published_at:
          type: string
          format: date-time
          nullable: true

    MyArticleItem:
      type: object
      required: [id, slug, title, status, version, view_count, like_count, comment_count, updated_at]
      properties:
        id: { type: string }
        slug: { type: string }
        title: { type: string }
        summary: { type: string }
        status: { $ref: '#/components/schemas/ArticleStatus' }
        version: { type: integer }
        view_count: { type: integer }
        like_count: { type: integer }
        comment_count: { type: integer }
        reject_reason: { type: string }
        published_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time

    ArticleListData:
      type: object
      required: [items, has_more]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ArticleBrief' }
        next_cursor: { type: string, nullable: true }
        has_more: { type: boolean }

    ArticleListResponse:
      type: object
      required: [code, message, request_id]
      properties:
        code: { type: integer, example: 0 }
        message: { type: string, example: ok }
        data: { $ref: '#/components/schemas/ArticleListData' }
        request_id: { type: string }

    MyArticleListData:
      type: object
      required: [items, has_more]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/MyArticleItem' }
        next_cursor: { type: string, nullable: true }
        has_more: { type: boolean }

    MyArticleListResponse:
      type: object
      required: [code, message, request_id]
      properties:
        code: { type: integer, example: 0 }
        message: { type: string, example: ok }
        data: { $ref: '#/components/schemas/MyArticleListData' }
        request_id: { type: string }

    ArticleDetail:
      type: object
      required: [id, slug, title, content_html, status, author, view_count, like_count, favorite_count, comment_count, allow_comment, is_liked, is_favorited]
      properties:
        id: { type: string }
        slug: { type: string }
        title: { type: string }
        summary: { type: string }
        content_html: { type: string }
        cover_url: { type: string }
        status: { $ref: '#/components/schemas/ArticleStatus' }
        author: { $ref: '#/components/schemas/AuthorBrief' }
        category:
          allOf:
            - $ref: '#/components/schemas/CategoryBrief'
          nullable: true
        tags:
          type: array
          items: { $ref: '#/components/schemas/TagBrief' }
        view_count: { type: integer }
        like_count: { type: integer }
        favorite_count: { type: integer }
        comment_count: { type: integer }
        reading_time: { type: integer }
        allow_comment: { type: boolean }
        is_liked: { type: boolean }
        is_favorited: { type: boolean }
        published_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time

    ArticleDetailResponse:
      type: object
      required: [code, message, request_id]
      properties:
        code: { type: integer, example: 0 }
        message: { type: string, example: ok }
        data: { $ref: '#/components/schemas/ArticleDetail' }
        request_id: { type: string }

    ArticleEdit:
      type: object
      required: [id, title, slug, content_md, status, version, allow_comment, updated_at]
      properties:
        id: { type: string }
        title: { type: string }
        slug: { type: string }
        summary: { type: string }
        content_md: { type: string }
        cover_url: { type: string }
        category_id: { type: string }
        tag_ids:
          type: array
          items: { type: string }
        status: { $ref: '#/components/schemas/ArticleStatus' }
        version: { type: integer }
        allow_comment: { type: boolean }
        reject_reason: { type: string }
        updated_at:
          type: string
          format: date-time

    ArticleEditResponse:
      type: object
      required: [code, message, request_id]
      properties:
        code: { type: integer, example: 0 }
        message: { type: string, example: ok }
        data: { $ref: '#/components/schemas/ArticleEdit' }
        request_id: { type: string }

    CreateArticleRequest:
      type: object
      required: [title, content_md]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        slug:
          type: string
          pattern: '^[a-z0-9-]{1,200}$'
          description: 为空则按标题生成，冲突返回 30003
        content_md: { type: string, minLength: 1 }
        summary: { type: string, maxLength: 512 }
        cover_url: { type: string, maxLength: 255 }
        category_id: { type: string, description: 默认 "0" 表示未分类 }
        tag_ids:
          type: array
          maxItems: 5
          items: { type: string }
        allow_comment: { type: boolean }

    UpdateArticleRequest:
      type: object
      required: [version]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        slug:
          type: string
          pattern: '^[a-z0-9-]{1,200}$'
        content_md: { type: string, minLength: 1 }
        summary: { type: string, maxLength: 512 }
        cover_url: { type: string, maxLength: 255 }
        category_id: { type: string }
        tag_ids:
          type: array
          maxItems: 5
          items: { type: string }
        allow_comment: { type: boolean }
        version: { type: integer, description: 与当前版本不一致返回 30004 }

    ArticleMutationData:
      type: object
      required: [id, slug, status, version]
      properties:
        id: { type: string }
        slug: { type: string }
        status: { $ref: '#/components/schemas/ArticleStatus' }
        version: { type: integer }

    ArticleMutationResponse:
      type: object
