        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminReindexRequest' }
      description: |
        `all=true` 为全量重建：文章量大时同步执行会超过网关超时（Nginx 60s），
        因此该模式立即返回 202，实际重建在后台执行，可用 /admin/index-failures 观察失败队列。
