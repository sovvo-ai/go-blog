openapi: 3.0.3

info:
  title: Blog API
  version: 1.0.0
  description: |
    企业级博客系统 V1.0 接口契约。

    本文件是唯一契约来源，由 `oapi-codegen` 生成 Go DTO 类型，
    由 `openapi-typescript` 生成前端 TS 类型。

    **当前范围**：认证（8）+ 用户（5），对应开发阶段 2。
    文章、互动、聊天、管理端接口在后续阶段按需补充，
    补充时保持与 API_SPEC.md 一致。

    **约定**
    - 所有 ID 以字符串返回，避免 JS 精度丢失
    - 时间格式为 RFC3339 UTC
    - 成功响应统一包裹 `{code, message, data, request_id}`
    - 204 响应无 body
    - 认证依赖 HttpOnly Cookie，不使用 Authorization 头
    - 写请求需携带 `X-CSRF-Token`

servers:
  - url: /api/v1
    description: 同域反向代理（Nginx）

tags:
  - name: auth
    description: 注册、验证、登录、令牌刷新、密码找回
  - name: user
    description: 当前用户资料与公开主页

security:
  - cookieAuth: []

paths:
  # ==========================================================
  # 认证
  # ==========================================================
  /auth/register:
    post:
      tags: [auth]
      summary: 注册
      description: |
        创建账号后状态为 `pending_verify`，**不签发任何 Token**。
        立即发送验证邮件，链接 24 小时有效。
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: 注册成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/verify-email:
    get:
      tags: [auth]
      summary: 验证邮箱
      description: 一次性消费，成功后状态变为 `active`。
      operationId: verifyEmail
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 验证成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /auth/resend-verify:
    post:
      tags: [auth]
      summary: 重发验证邮件
      description: |
        无论邮箱是否存在、是否已验证，统一返回相同文案，避免邮箱枚举。
      operationId: resendVerify
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailOnlyRequest'
      responses:
        '200':
          description: 已受理（不代表邮箱一定存在）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/login:
    post:
      tags: [auth]
      summary: 登录
      description: |
        成功后通过 Set-Cookie 下发 `access_token`、`refresh_token`、`csrf_token`。

        - `pending_verify` 返回 20004，**不设置任何 Cookie**
        - `disabled` 返回 20005
        - 密码错误与账号不存在返回同一错误 20003
        - 连续失败 5 次锁定 15 分钟（20006）
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          headers:
            Set-Cookie:
              description: 三个 Cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/refresh:
    post:
      tags: [auth]
      summary: 刷新令牌
      description: |
        从 `refresh_token` Cookie 读取凭证，轮换后覆盖三个 Cookie。

        并发刷新时，第二个请求可能返回 401（交接窗口默认关闭），
        客户端应重试一次。
      operationId: refreshToken
      security: []
      responses:
        '200':
          description: 刷新成功
          headers:
            Set-Cookie:
              description: 三个 Cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags: [auth]
      summary: 退出登录
      description: 吊销当前设备所属 family，不影响其他设备。
      operationId: logout
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: 已退出，并清除 Cookie
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/forgot-password:
    post:
      tags: [auth]
      summary: 申请重置密码
      description: |
        统一返回相同文案，不泄露邮箱是否存在。

        `pending_verify` 用户调用时，实际执行"重发验证邮件"，不生成重置令牌。
      operationId: forgotPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailOnlyRequest'
      responses:
        '200':
          description: 已受理
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/reset-password:
    post:
      tags: [auth]
      summary: 重置密码
      description: |
        令牌一次性消费。成功后吊销该用户全部 Refresh Token，
        所有设备需重新登录。
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: 重置成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  # ==========================================================
  # 用户
  # ==========================================================
  /users/me:
    get:
      tags: [user]
      summary: 当前用户信息
      operationId: getCurrentUser
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [user]
      summary: 更新个人资料
      description: 仅允许修改昵称与简介，用户名与邮箱不可改。
      operationId: updateProfile
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /users/me/password:
    put:
      tags: [user]
      summary: 修改密码
      description: 成功后吊销全部 Refresh Token，清空 Cookie。
      operationId: changePassword
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: 修改成功
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /users/me/avatar:
    put:
      tags: [user]
      summary: 更新头像
      description: 服务端生成 64/128/256 三档，返回 256 档 URL。
      operationId: updateAvatar
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvatarResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /users/{id}:
    get:
      tags: [user]
      summary: 用户公开主页
      description: 不返回 email、status、last_login_* 等敏感字段。
      operationId: getPublicUser
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: "1001"
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicUserResponse'
        '404':
          $ref: '#/components/responses/NotFound'

# ==========================================================
# 组件
# ==========================================================
  /categories:
    get:
      tags: [article]
      summary: 分类列表
      description: 不含"未分类"虚拟项，category_id=0 由前端自行表示。
      operationId: listCategories
      security: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoryListResponse' }

  /tags:
    get:
      tags: [article]
      summary: 标签列表
      description: 按文章数倒序，最多 100 个。
      operationId: listTags
      security: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TagListResponse' }

  /articles:
    get:
      tags: [article]
      summary: 公开文章列表
      description: |
        只返回 status=published 且未删除的文章，列表项不含正文。
        sort=hot 走数据库直查（近 30 天浏览量），不经过搜索引擎。
      operationId: listArticles
      security: []
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, minimum: 1, maximum: 50 }
        - name: cursor
          in: query
          schema: { type: string }
        - name: sort
          in: query
          schema: { type: string, enum: [latest, hot], default: latest }
        - name: category_id
          in: query
          description: 传 "0" 表示未分类
          schema: { type: string }
        - name: tag_id
          in: query
          schema: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArticleListResponse' }
    post:
      tags: [article]
      summary: 创建草稿
      operationId: createArticle
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateArticleRequest' }
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArticleMutationResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /articles/{id}:
    get:
      tags: [article]
      summary: 文章详情
      description: |
        key 为 slug 或纯数字 ID。非公开状态对非作者一律 404（不泄露存在性），
        已删除返回 410。不返回 content_md，编辑请用 /articles/{id}/edit。
      operationId: getArticle
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArticleDetailResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410':
          description: 文章已删除
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    put:
      tags: [article]
      summary: 更新文章
      description: 仅作者本人可改；必须携带 version 做乐观锁。
      operationId: updateArticle
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateArticleRequest' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArticleMutationResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [article]
      summary: 删除文章
      description: 软删除；公开 URL 之后返回 410。
      operationId: deleteArticle
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: 已删除
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /search:
    get:
      tags: [article]
      summary: 全文检索
      description: |
        偏移分页（全站唯一例外，见 API_SPEC 1.6.2）：Meilisearch 仅支持 offset/limit，
        page × page_size 超过 1000 返回 400。
        检索服务不可用时返回 200 + 空结果 + degraded=true，不返回 5xx。
      operationId: searchArticles
      security: []
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 100 }
        - name: page
          in: query
          schema: { type: integer, default: 1, minimum: 1 }
        - name: page_size
          in: query
          schema: { type: integer, default: 20, minimum: 1, maximum: 50 }
      responses:
        '200':
          description: 成功（检索服务降级时同样返回 200）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /articles/{id}/edit:
    get:
      tags: [article]
      summary: 取正文供编辑
      description: 仅作者本人可调用；管理员也返回 403。
      operationId: getArticleForEdit
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArticleEditResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /articles/{id}/submit:
    post:
      tags: [article]
      summary: 提交（发布或送审）
      description: 审核关闭直接 published，开启则进入 pending。
      operationId: submitArticle
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArticleStatusResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /articles/{id}/withdraw:
    post:
      tags: [article]
      summary: 撤回审核
      operationId: withdrawArticle
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArticleStatusResponse' }
        '409': { $ref: '#/components/responses/Conflict' }

  /articles/{id}/archive:
    post:
      tags: [article]
      summary: 归档
      operationId: archiveArticle
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArticleStatusResponse' }
        '409': { $ref: '#/components/responses/Conflict' }

  /articles/{id}/restore:
    post:
      tags: [article]
      summary: 恢复为草稿
      operationId: restoreArticle
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArticleStatusResponse' }
        '409': { $ref: '#/components/responses/Conflict' }

  /articles/{id}/like:
    post:
      tags: [interaction]
      summary: 点赞
      operationId: likeArticle
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LikeResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [interaction]
      summary: 取消点赞
      operationId: unlikeArticle
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LikeResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /articles/{id}/favorite:
    post:
      tags: [interaction]
      summary: 收藏
      operationId: favoriteArticle
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FavoriteResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [interaction]
      summary: 取消收藏
      operationId: unfavoriteArticle
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FavoriteResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /articles/{id}/comments:
    get:
      tags: [interaction]
      summary: 评论列表
      operationId: listComments
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: root_id
          in: query
          description: 只取某主楼下的回复
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 20, minimum: 1, maximum: 50 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommentListResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [interaction]
      summary: 发表评论
      operationId: createComment
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCommentRequest' }
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommentMutationResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /comments/{id}:
    delete:
      tags: [interaction]
      summary: 删除评论
      operationId: deleteComment
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: 已删除
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /reports:
    post:
      tags: [interaction]
      summary: 举报
      operationId: createReport
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReportRequest' }
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /users/me/favorites:
    get:
      tags: [interaction]
      summary: 我的收藏
      operationId: listMyFavorites
