name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Go 版本口径（TECH_DESIGN 2.3）：
#   go.mod 的 go 指令是最低要求 1.26.0
#   CI 与生产构建使用 1.27.2，与 deploy/Dockerfile 保持一致
# 只跑一个版本：多版本矩阵会拖慢流水线，兼容性由 go 指令约束保证。

env:
  GO_VERSION: "1.27.2"

jobs:
  build-test:
    name: 构建与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: 校验 go.mod 未被篡改
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: 格式检查
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化："
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: 测试（含竞态检测）
        run: go test ./... -race -count=1 -coverprofile=coverage.out

      - name: 构建
        run: go build -trimpath -ldflags="-s -w" -o bin/server ./cmd/server

  generated-code:
    name: 生成代码是否最新
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # 契约先行：openapi.yaml 与 wire 的产物必须与源文件同步，
      # 否则说明有人改了接口或 provider 却没重新生成。
      - name: 重新生成并比对
        run: |
          go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.8.0 \
            -config api/oapi-codegen.yaml api/openapi.yaml
          go run github.com/google/wire/cmd/wire@v0.7.0 ./internal/bootstrap
          git diff --exit-code internal/dto internal/bootstrap

  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装依赖
        working-directory: web
        run: npm ci --no-audit --no-fund

      # nuxt build 会跑完整的模板编译与 TS 检查，
      # 是目前前端唯一可靠的"能不能上线"信号（无单测覆盖）。
      - name: 生产构建
        working-directory: web
        run: npm run build
